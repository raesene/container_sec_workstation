---
  - name: Get teisteanas
    get_url:
      url: https://github.com/raesene/teisteanas/releases/download/v0.0.10/teisteanas_Linux_x86_64.tar.gz
      dest: /tmp/teisteanas.tar.gz

  - name: unarchive teisteanas
    unarchive:
      src: /tmp/teisteanas.tar.gz
      dest: /tmp
      remote_src: yes

  - name: move teisteanas into place
    copy:
      src: /tmp/teisteanas
      dest: /usr/local/bin
      mode: 0755
      remote_src: yes