---
  - name: Get eathar
    get_url:
      url: https://github.com/raesene/eathar/releases/download/v0.2.18/eathar_Linux_arm64.tar.gz
      dest: /tmp/eathar.tar.gz

  - name: unarchive eathar
    unarchive:
      src: /tmp/eathar.tar.gz
      dest: /tmp
      remote_src: yes

  - name: move eathar into place
    copy:
      src: /tmp/eathar
      dest: /usr/local/bin
      mode: 0755
      remote_src: yes