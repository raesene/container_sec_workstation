---
  - name: Get amicontained
    get_url:
      url: https://github.com/raesene/amicontained/releases/download/v0.0.3/amicontained_0.0.3_linux_amd64.tar.gz
      dest: /tmp/amicontained.tar.gz

  - name: unarchive amicontained
    unarchive:
      src: /tmp/amicontained.tar.gz
      dest: /tmp
      remote_src: yes

  - name: move amicontained into place
    copy:
      src: /tmp/amicontained
      dest: /usr/local/bin
      mode: 0755
      remote_src: yes